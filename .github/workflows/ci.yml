name: CI

# Trigger the workflow when code is pushed to the `main` branch.
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: workshop-app
  # The Docker Hub username is stored in a GitHub secret.
  # The workflow uses it below when tagging the image.

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code.
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Docker Buildx for building the image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image and tag it with the current commit SHA.
      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      # Scan the built image with Trivy and fail on CRITICAL vulnerabilities.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Log in to Docker Hub using the repository secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag the image as :latest and :<commit SHA>, then push both tags.
      - name: Tag and push
        run: |
          FULL=${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME
          docker tag $IMAGE_NAME:${{ github.sha }} $FULL:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} $FULL:latest
          docker push $FULL:${{ github.sha }}
          docker push $FULL:latest